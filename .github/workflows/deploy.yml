name: Salesforce Delta Deployment Pipeline

on:
  pull_request:
    branches: [dev, uat]
  push:
    branches: [dev, uat]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

#############################################
# ✅ PR VALIDATION JOB
#############################################
  validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      #####################################
      # Checkout
      #####################################
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      #####################################
      # Detect Changed Apex Files
      #####################################
      - name: Detect Changed Apex Files
        run: |
          CHANGED_FILES=$(git diff --name-only \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }})

          echo "Changed files:"
          echo "$CHANGED_FILES"

          APEX_CLASSES=$(echo "$CHANGED_FILES" | grep -E 'force-app/.*/classes/.*\.cls$' || true)
          TEST_CLASSES=$(echo "$CHANGED_FILES" | grep -E 'force-app/.*/classes/.*Test\.cls$' || true)

          if [ -z "$APEX_CLASSES" ] && [ -z "$TEST_CLASSES" ]; then
            echo "NO_APEX_CHANGES=true" >> $GITHUB_ENV
          else
            echo "NO_APEX_CHANGES=false" >> $GITHUB_ENV
          fi

          echo "TEST_CLASSES=$(echo "$TEST_CLASSES" | tr '\n' ' ')" >> $GITHUB_ENV

      #####################################
      # Resolve Apex Test Strategy
      #####################################
      - name: Resolve Apex Test Strategy
        run: |
          if [[ "$NO_APEX_CHANGES" == "true" ]]; then
            echo "APEX_TEST_LEVEL=NoTestRun" >> $GITHUB_ENV
            exit 0
          fi

          AUTO_TESTS=$(echo "$TEST_CLASSES" \
            | xargs -n 1 basename \
            | sed 's/\.cls//' \
            | tr '\n' ' ')

          if [ -n "$AUTO_TESTS" ]; then
            echo "APEX_TEST_LEVEL=RunSpecifiedTests" >> $GITHUB_ENV
            echo "APEX_TESTS=$AUTO_TESTS" >> $GITHUB_ENV
          else
            echo "❌ Apex changes detected but no test class committed"
            exit 1
          fi

      #####################################
      # Install Salesforce CLI + Delta
      #####################################
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install sfdx-git-delta
        run: echo y | sf plugins install sfdx-git-delta

      #####################################
      # Authenticate (QA for validation)
      #####################################
      - name: Authenticate to QA
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a QA

      #####################################
      # Generate Delta (CORRECT DX ROOT)
      #####################################
      - name: Generate Delta
        run: |
          mkdir changed-sources
          sf sgd:source:delta \
            --to "${{ github.event.pull_request.head.sha }}" \
            --from "${{ github.event.pull_request.base.sha }}" \
            --output-dir changed-sources \
            --generate-delta

      #####################################
      # Ensure Test Classes Are Included
      #####################################
      - name: Include Test Classes
        if: env.APEX_TEST_LEVEL == 'RunSpecifiedTests'
        run: |
          mkdir -p changed-sources/main/default/classes
          for test in $APEX_TESTS; do
            echo "Including test: $test"
            cp force-app/main/default/classes/$test.cls \
               changed-sources/main/default/classes/
            cp force-app/main/default/classes/$test.cls-meta.xml \
               changed-sources/main/default/classes/
          done

      #####################################
      # Validate Deployment (DRY RUN)
      #####################################
      - name: Validate Deployment
        run: |
          echo "Running tests: $APEX_TESTS"

          sf project deploy start \
            --source-dir changed-sources \
            --dry-run \
            --ignore-conflicts \
            --test-level RunSpecifiedTests \
            --tests "$APEX_TESTS" \
            --wait 30 \
            -o QA

#############################################
# ✅ DEPLOY TO QA (MERGE TO dev)
#############################################
  deploy_qa:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - run: npm install --global @salesforce/cli
      - run: echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to QA
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a QA

      - name: Generate Delta
        run: |
          mkdir changed-sources
          sf sgd:source:delta \
            --to HEAD \
            --from HEAD~1 \
            --output-dir changed-sources \
            --generate-delta

      - name: Deploy to QA
        run: |
          sf project deploy start \
            --source-dir changed-sources \
            --ignore-conflicts \
            --test-level RunLocalTests \
            --wait 30 \
            -o QA

#############################################
# ✅ DEPLOY TO UAT (MERGE TO uat)
#############################################
  deploy_uat:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - run: npm install --global @salesforce/cli
      - run: echo y | sf plugins install sfdx-git-delta

      - name: Authenticate to UAT
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_UAT }}" > auth.txt
          sf org login sfdx-url -f auth.txt -a UAT

      - name: Generate Delta
        run: |
          mkdir changed-sources
          sf sgd:source:delta \
            --to HEAD \
            --from HEAD~1 \
            --output-dir changed-sources \
            --generate-delta

      - name: Deploy to UAT
        run: |
          sf project deploy start \
            --source-dir changed-sources \
            --ignore-conflicts \
            --test-level RunLocalTests \
            --wait 30 \
            -o UAT
